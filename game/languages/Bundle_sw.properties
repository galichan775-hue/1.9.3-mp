t6 = Genomskinliga provinser, de provinser utan färg, är neutrala. Provinser med en färg tillhör andra Civilizationer. Randiga provinser är ockuperade.
t6a = Städer finns i provinserna med mest befolkning utav Civilizationens alla provinser. Dessa provinser är nyckelprovinser.

